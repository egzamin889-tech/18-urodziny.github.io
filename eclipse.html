<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🌑 Zaćmienie Słońca.. Nie udało się obejrzeć razem to jest tutaj </title>

    <link rel="stylesheet" href="eclipse.css">
</head>

<body>

    <main class="eclipse-page">

        <!-- NIEBO -->

        <div class="sky">

            <!-- GWIAZDY -->

            <div class="stars"></div>


            <!-- SŁOŃCE -->

            <div class="sun">

                <div class="sun-glow"></div>

                <div class="sun-core"></div>

                <div class="corona"></div>

            </div>


            <!-- KSIĘŻYC -->

            <div class="moon">

                <div class="moon-surface"></div>

                <div class="moon-crater crater-1"></div>
                <div class="moon-crater crater-2"></div>
                <div class="moon-crater crater-3"></div>
                <div class="moon-crater crater-4"></div>
                <div class="moon-crater crater-5"></div>

            </div>


            <!-- INFORMACJA -->

            <div class="eclipse-info">

                <h1>🌑 Zaćmienie Słońca</h1>

                <p>
                    Księżyc powoli przesuwa się przed Słońcem... 
                </p>

            </div>


            <!-- NAPIS PODCZAS PEŁNEGO ZAĆMIENIA -->

            <div class="totality-message">

                <h2>Całkowite zaćmienie</h2>

                <p>
                    🌑
                </p>

            </div>

                <div class="diamond-ring"></div>
            <!-- POWRÓT DO MENU -->

            <a
                href="index.html"
                class="back-button"
            >
                ← Wróć do menu
            </a>

        </div>

    </main>


    <script src="eclipse.js"></script>

</body>

</html>
