<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🧀 Oscypek w górach</title>

    <link rel="stylesheet" href="mountains.css">
</head>

<body>

    <main class="mountains-page">

        <div class="mountain-scene">

            <!-- NIEBO -->

            <div class="sky"></div>


            <!-- GÓRY -->

            <div class="mountains far-mountains"></div>

            <div class="mountains near-mountains"></div>


            <!-- ZIEMIA -->

            <div class="ground"></div>


            <!-- OGNISKO -->

            <div class="fireplace">

                <div class="grill"></div>

                <div class="fire">

                    <div class="flame flame-one"></div>
                    <div class="flame flame-two"></div>
                    <div class="flame flame-three"></div>

                </div>

                <!-- OSCYPEK -->

                <button class="oscypek" aria-label="Oscypek">
                    🧀
                </button>

            </div>


            <!-- INFORMACJA -->

            <div class="mountain-title">

                <h1>🧀 Oscypek w górach</h1>

                <p>
                    Upiecz oscypka przy ognisku!
                </p>

            </div>


            <!-- PANEL GRILLOWANIA -->

            <div class="cooking-panel">

                <p class="cooking-status">
                    Oscypek jeszcze się piecze...
                </p>

                <div class="progress">

                    <div class="progress-bar"></div>

                </div>

                <button class="eat-button">
                    🧀 Zjedz oscypka
                </button>

            </div>


            <!-- WIADOMOŚĆ -->

            <div class="eat-message">

                <h2>
                    Mmmm... 🧀
                </h2>

                <p>
                    Oscypek w górach smakuje najlepiej!
                </p>

            </div>


            <!-- POWRÓT -->

            <a
                href="index.html"
                class="back-button"
            >
                ← Wróć do menu
            </a>

        </div>

    </main>


    <script src="mountains.js"></script>

</body>

</html>
